name: PR27 format release checklist

on:
  push:
    branches: [chore/v1-release]

permissions:
  contents: write

concurrency:
  group: pr27-format-release
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/v1-release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write docs/release-checklist.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- docs/release-checklist.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release-checklist.md
          git commit -m "Format v1 release checklist"
          git push origin HEAD:chore/v1-release
