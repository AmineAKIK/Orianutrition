name: PR28 format responsive polish

on:
  push:
    branches: [fix/responsive-release-polish]

permissions:
  contents: write

concurrency:
  group: pr28-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/responsive-release-polish
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/components/layout/Layout.tsx e2e/app.spec.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/components/layout/Layout.tsx e2e/app.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/Layout.tsx e2e/app.spec.ts
          git commit -m "Format responsive release polish"
          git push origin HEAD:fix/responsive-release-polish
