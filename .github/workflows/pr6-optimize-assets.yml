name: PR6 validation

on:
  push:
    branches: [perf/asset-and-route-optimization]

permissions:
  contents: write

concurrency:
  group: pr6-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - name: Format PR6 changes
        run: |
          npx prettier --write src/app/App.tsx scripts/check-performance-budget.mjs
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx scripts/check-performance-budget.mjs
          git commit -m "Format PR6 performance changes"
          git push
      - run: npx playwright install --with-deps chromium
      - run: npm run quality:ci
