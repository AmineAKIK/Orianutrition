name: PR6 optimize assets

on:
  push:
    branches: [perf/asset-and-route-optimization]

permissions:
  contents: write

concurrency:
  group: pr6-optimize-assets
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Convert editorial PNG assets to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for source in sorted(Path("src/assets").rglob("*.png")):
              target = source.with_suffix(".webp")
              with Image.open(source) as image:
                  image.save(target, "WEBP", quality=80, method=6)
              print(f"{source} -> {target} ({source.stat().st_size} -> {target.stat().st_size})")
              source.unlink()

          for path in Path("src").rglob("*"):
              if path.suffix not in {".ts", ".tsx"}:
                  continue
              text = path.read_text()
              updated = text.replace(".png\"", ".webp\"").replace(".png'", ".webp'")
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Optimize editorial images"
          git push
